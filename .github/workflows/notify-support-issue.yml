name: Notify Support Issue or Discussion Created

on:
  issues:
    types: [opened]
  discussion:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get GIF
        id: gif
        run: |
          # Randomly pick one of the two funny GIFs
          if [ $((RANDOM % 2)) -eq 0 ]; then
            # "It's happening" - The Office
            GIF_URL=$(curl -s "https://api.giphy.com/v1/gifs/search?api_key=${{ secrets.GIPHY_API_KEY }}&q=its+happening+the+office&limit=1" | jq -r '.data[0].images.fixed_height.url')
          else
            # "This is fine" - dog in fire
            GIF_URL=$(curl -s "https://api.giphy.com/v1/gifs/search?api_key=${{ secrets.GIPHY_API_KEY }}&q=this+is+fine&limit=1" | jq -r '.data[0].images.fixed_height.url')
          fi
          echo "url=$GIF_URL" >> $GITHUB_OUTPUT

      - name: Notify Slack
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          DISCUSSION_AUTHOR: ${{ github.event.discussion.user.login }}
          GIF_URL: ${{ steps.gif.outputs.url }}
          WEBHOOK_URL: ${{ secrets.SUPPORT_ISSUE_WEBHOOK_URL }}
        run: |
          if [ "$EVENT_NAME" == "issues" ]; then
            TITLE="$ISSUE_TITLE"
            URL="$ISSUE_URL"
            AUTHOR="$ISSUE_AUTHOR"
            TYPE="Issue"
          else
            TITLE="$DISCUSSION_TITLE"
            URL="$DISCUSSION_URL"
            AUTHOR="$DISCUSSION_AUTHOR"
            TYPE="Discussion"
          fi

          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"🚨 *New ${TYPE} Created*\n*<${URL}|${TITLE}>*\nBy: ${AUTHOR}\"
                  }
                },
                {
                  \"type\": \"image\",
                  \"image_url\": \"${GIF_URL}\",
                  \"alt_text\": \"panic gif\"
                }
              ]
            }"
