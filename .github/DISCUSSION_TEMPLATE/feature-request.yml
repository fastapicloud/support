labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in FastAPI Cloud! 🚀

        Please follow these instructions, fill every question, and do every step. 🙏

        By describing your feature request in a structured way (following this) it will be much easier to understand, discuss, and prioritize it.
  - type: checkboxes
    id: checks
    attributes:
      label: First Check
      description: Please confirm and check all the following options.
      options:
        - label: I added a very descriptive title here.
          required: true
        - label: I used the GitHub search to find a similar feature request and didn't find it.
          required: true
        - label: I searched the FastAPI Cloud documentation and didn't find this feature.
          required: true
        - label: I already checked that this feature is related to FastAPI Cloud and not to [FastAPI](https://github.com/fastapi/fastapi) itself.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: |
        Which part of FastAPI Cloud is this feature request about?

        Pick all that apply. If it doesn't fit any of these, choose "Other" and explain below.
      multiple: true
      options:
        - CLI
        - Dashboard
        - Deployments & builds
        - Integrations (databases, GitHub, CI/CD, etc.)
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: |
        A clear and concise description of what the problem is.

        What are you trying to do? What is currently getting in your way?
      placeholder: |
        Right now, when I deploy an app, I have to ... and there's no easy way to ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: |
        A clear and concise description of what you want to happen.

        How would you like FastAPI Cloud to behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or workarounds you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any additional context information or screenshots you think are useful.
